<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>會員中心 - 得正 dejeng</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;500;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #f4f6f8 0%, #e0e8f0 100%); 
            font-family: 'Noto Sans TC', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .navbar { background: #B0E0E6; padding: 10px 20px; box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1); }
        .navbar-brand { font-size: 1.5rem; font-weight: bold; color: #2F4F4F; text-decoration: none; display: flex; align-items: center; gap: 10px; }
        .navbar-brand img { width: 40px; height: 40px; }
        
        .profile-container {
            max-width: 600px;
            margin: 50px auto;
            background: #fff;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.05);
            flex-grow: 1;
        }

        .profile-header { text-align: center; margin-bottom: 30px; }
        .profile-icon { font-size: 4rem; color: #4682B4; margin-bottom: 15px; }
        
        .form-group { margin-bottom: 20px; }
        .form-label { font-weight: 600; color: #2F4F4F; }
        .form-control { border-radius: 10px; padding: 12px; background: #f4f6f8; border: 1px solid #dee2e6; }
        .form-control:focus { border-color: #4682B4; box-shadow: 0 0 0 0.25rem rgba(70, 130, 180, 0.2); background: #ffffff; }

        .btn-gradient { background: linear-gradient(135deg, #5DADE2 0%, #4682B4 100%); border: none; color: white; padding: 12px; font-weight: 700; border-radius: 50px; transition: 0.3s; width: 100%; margin-top: 10px; }
        .btn-gradient:hover { transform: translateY(-3px); box-shadow: 0 10px 20px rgba(93, 173, 226, 0.3); color: white; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="image/logo.jpeg" alt="Logo"> 得正 dejeng
            </a>
            <div class="d-flex align-items-center">
                <a href="index.html" class="btn btn-outline-dark rounded-pill px-4"><i class="fa-solid fa-house"></i> 回首頁</a>
                <button id="btn-logout" class="btn btn-outline-danger rounded-pill px-4 ms-3" style="display:none;">登出</button>
            </div>
        </div>
    </nav>

    <div class="container d-flex flex-column align-items-center">
        <div class="profile-container w-100">
            <div class="profile-header">
                <i class="fa-solid fa-circle-user profile-icon"></i>
                <h2 style="color: #2F4F4F; font-weight: 800;">會員中心</h2>
                <p class="text-muted">管理您的帳號與密碼</p>
            </div>
            
            <div class="form-group">
                <label class="form-label">登入信箱 (Email)</label>
                <input type="text" id="user-email" class="form-control" disabled value="讀取中...">
            </div>

            <hr class="my-4">
            <h4 style="color: #2F4F4F; font-weight: 700; margin-bottom: 20px;">修改密碼</h4>

            <div class="form-group">
                <label class="form-label">新密碼</label>
                <input type="password" id="new-password" class="form-control" placeholder="請輸入至少 6 位數新密碼">
            </div>

            <button id="btn-update-pwd" class="btn btn-gradient">確認修改密碼</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut, updatePassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { apiKey: "AIzaSyC-LcCfcPYCYAQZ7n45YCe6tCY_jb-ygvI", authDomain: "sonicboom-shop.firebaseapp.com", projectId: "sonicboom-shop", storageBucket: "sonicboom-shop.firebasestorage.app", messagingSenderId: "976804831944", appId: "1:976804831944:web:6ede6a95196478bd49bbfd", measurementId: "G-3FEKWL0QXZ" };
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-email').value = user.email;
                document.getElementById('btn-logout').style.display = 'inline-block';
            } else {
                alert('您尚未登入，請先登入！');
                window.location.href = 'login.html';
            }
        });

        document.getElementById('btn-logout').addEventListener('click', () => {
            if(confirm("確定要登出嗎？")) { 
                localStorage.removeItem('dejeng_cart'); 
                signOut(auth).then(() => { window.location.href = 'index.html'; }); 
            }
        });

        document.getElementById('btn-update-pwd').addEventListener('click', () => {
            const user = auth.currentUser;
            const newPwd = document.getElementById('new-password').value;
            
            if(!newPwd || newPwd.length < 6) {
                alert('密碼不得為空，且至少需要 6 個字元。');
                return;
            }

            if(user) {
                const btn = document.getElementById('btn-update-pwd');
                btn.innerText = '修改中...';
                btn.disabled = true;

                updatePassword(user, newPwd).then(() => {
                    alert('密碼修改成功！請重新登入。');
                    signOut(auth).then(() => { window.location.href = 'login.html'; });
                }).catch((error) => {
                    console.error(error);
                    if(error.code === 'auth/requires-recent-login') {
                        alert('基於安全考量，修改密碼需要重新驗證身分，請先登出再重新登入後修改。');
                    } else {
                        alert('修改失敗，請稍後再試。');
                    }
                    btn.innerText = '確認修改密碼';
                    btn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
